<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cisco Meraki Licensing Viewer 2.0</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1c2330; --muted: #5f6b7c; --border: #dfe3e8;
  --accent: #0a6cbd; --accent-soft: #e3f0fb; --ok: #1f8a4c; --ok-soft: #e2f4ea;
  --warn: #b26a00; --warn-soft: #fdf1dc; --bad: #c0362c; --bad-soft: #fbe5e3; --bar: #d6dde6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --panel: #1b2129; --text: #e4e8ee; --muted: #9aa5b4; --border: #2c3440;
    --accent: #5aa9ec; --accent-soft: #1d3247; --ok: #4cc283; --ok-soft: #173326;
    --warn: #e5a544; --warn-soft: #3a2c14; --bad: #ef7b70; --bad-soft: #3d1f1c; --bar: #2c3440;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1b2129; --text: #e4e8ee; --muted: #9aa5b4; --border: #2c3440;
  --accent: #5aa9ec; --accent-soft: #1d3247; --ok: #4cc283; --ok-soft: #173326;
  --warn: #e5a544; --warn-soft: #3a2c14; --bad: #ef7b70; --bad-soft: #3d1f1c; --bar: #2c3440;
}
.viz { --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s-other:#898781; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; }
}
:root[data-theme="dark"] .viz { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; }
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
header .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
.crumbs { margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--muted); font-size: 12px; }
section.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
section.card > h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
section.card > h2 .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
.body { padding: 12px 14px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0; cursor: pointer; user-select: none; }
td.num, th.num { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--accent-soft); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.barwrap { display: flex; align-items: center; gap: 8px; min-width: 160px; }
.bar { flex: 1; height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.ok > i { background: var(--ok); }
.bar.lic > i { background: var(--seg-lic); }
.muted { color: var(--muted); }
.err { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
.grid2 > section.card { margin-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { border-radius: 16px; padding: 5px 12px; font-weight: 500; }
.chip span { color: var(--muted); font-weight: 400; margin-left: 2px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.on span { color: #fff; opacity: .8; }
.tile .v.err { color: var(--bad); }
.tile.alert { border-color: var(--bad); }
.tile.warnt .v { color: var(--warn); }
.notice { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; }
.notice button { border: 0; background: none; color: var(--muted); padding: 2px 6px; }
.tile.click { cursor: pointer; transition: border-color .15s; }
.tile.click:hover { border-color: var(--accent); }
.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
a.tilelink { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
a.tilelink.on { font-weight: 600; }
.tile.alert .v { color: var(--bad); }
.tile .go { margin-top: 8px; font-size: 12.5px; padding: 4px 10px; }
.tile .k .pc { text-transform: none; letter-spacing: 0; }
:root { --seg-none: #bcc4cf; --seg-lic: #2a78d6; --seg-unlic: #eb6834; --seg-mon: #8f86d9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --seg-none: #4a5361; --seg-lic: #3987e5; --seg-unlic: #d95926; --seg-mon: #9085e9; } }
:root[data-theme="dark"] { --seg-none: #4a5361; --seg-lic: #3987e5; --seg-unlic: #d95926; --seg-mon: #9085e9; }
.split { padding: 12px 14px 14px; }
.split .track { height: 18px; }
.split .legend { margin-top: 8px; }
.depmark { font-size: 12px; color: var(--muted); border: 1px solid var(--muted); border-bottom: 0; border-radius: 4px 4px 0 0; padding: 2px 6px 4px; margin-bottom: 4px; white-space: nowrap; min-width: max-content; }
.depmark strong { color: var(--text); }
a.go, button.go { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); text-decoration: none; cursor: pointer; border-radius: 6px; display: inline-block; }
.intro { font-size: 15px; margin: 0 0 6px; }
.intro strong { color: var(--bad); }
#tip { position: fixed; z-index: 50; max-width: 340px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: none; white-space: normal; }
#tip a, .note a { color: var(--accent); }
#tip p { margin: 6px 0 0; } #tip ul { margin: 4px 0 0; padding-left: 18px; }
details summary { cursor: pointer; color: var(--accent); }
footer.disclaimer { max-width: 1400px; margin: 0 auto; padding: 0 24px 28px; color: var(--muted); font-size: 12px; text-align: center; }
.readonly { background: var(--ok-soft); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 12px; }
/* charts */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-weight: 400; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.orgcharts { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; padding: 12px 14px 14px; }
.orgchart { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 12px; cursor: pointer; }
.orgchart:hover { border-color: var(--accent); }
.orgchart h3 { margin: 0 0 2px; font-size: 13.5px; }
.orgchart .s { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.hrow { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; padding: 3px 0; font-size: 12.5px; }
.hrow.net { grid-template-columns: minmax(120px, 220px) 1fr 44px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.hrow.net:hover, .hrow.net.on { background: var(--accent-soft); }
.hrow .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .val { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.track { height: 12px; }
.hbar { display: flex; gap: 2px; height: 100%; border-radius: 0 4px 4px 0; overflow: hidden; min-width: 2px; }
.hbar > span { display: block; height: 100%; min-width: 3px; }
.hbar.empty { background: none; }
.chartbody { padding: 10px 8px 12px; }
.netpill { border-radius: 16px; padding: 4px 10px; background: var(--accent-soft); border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Cisco Meraki Licensing Viewer <span class="muted" style="font-weight:400">2.0</span></h1>
  <div class="controls">
    <span id="status"></span>
    <label>Auto-refresh
      <select id="auto">
        <option value="0">Off</option><option value="60">1 min</option>
        <option value="300" selected>5 min</option><option value="900">15 min</option>
      </select>
    </label>
    <label>Theme
      <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
    <button id="keybtn">API key</button>
    <button class="primary" id="refresh">Refresh</button>
  </div>
</header>
<main id="app"></main>
<footer class="disclaimer"><strong>Read-only:</strong> This tool only sends GET (read) requests to the Meraki Dashboard API. It never sends POST, PUT or DELETE requests, so it can't make any changes to your Meraki Dashboard.</footer>

<script src="licensing-map.js"></script>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => b ? (100 * a / b) : 0;
const fmtPct = v => v.toFixed(1) + "%";
const bar = (v, cls = "") => `<div class="barwrap"><div class="bar ${cls}"><i style="width:${Math.min(100, v)}%"></i></div><span>${fmtPct(v)}</span></div>`;
const fmtDate = d => d ? new Date(d).toLocaleDateString() : "—";

// ---------- API key (kept in this browser only; sent to the local server, which forwards it to Meraki) ----------
const KEY_ITEM = "merakiApiKey";
function getKey() {
  try { return localStorage.getItem(KEY_ITEM) || sessionStorage.getItem(KEY_ITEM) || ""; } catch { return ""; }
}
function setKey(k, remember) {
  try {
    localStorage.removeItem(KEY_ITEM); sessionStorage.removeItem(KEY_ITEM);
    if (k) (remember ? localStorage : sessionStorage).setItem(KEY_ITEM, k);
  } catch {}
}

async function api(path) {
  const key = getKey();
  const r = await fetch("/api" + path, { headers: key ? { "X-Meraki-API-Key": key } : {} });
  const txt = await r.text();
  let body; try { body = JSON.parse(txt); } catch { body = txt; }
  if (!r.ok) {
    const msg = body && body.errors ? body.errors.join("; ") : `HTTP ${r.status}`;
    const err = new Error(msg);
    err.auth = r.status === 401;
    err.notFound = r.status === 404;
    throw err;
  }
  return body;
}
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

// ---------- state ----------
const state = { orgs: [], inv: {}, invErr: {}, lic: {}, licErr: {}, stat: {}, detail: {}, loading: false, updated: null, sort: {} };

function route() {
  const m = location.hash.match(/org=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
const view = () => (location.hash.match(/view=(\w+)/) || [])[1] || "";
const unlicensedHref = id => `#org=${encodeURIComponent(id)}&view=unlicensed`;

// ---------- data loading ----------
// An org that returns 404 has been deleted (or the key lost access): drop it and everything cached for it
function forgetOrg(id, name) {
  state.orgs = state.orgs.filter(o => o.id !== id);
  for (const k of ["inv", "invErr", "lic", "licErr", "stat", "detail"]) delete state[k][id];
  state.notice = `“${name || id}” wasn't found in Meraki Dashboard (it may have been deleted), so it's been removed from your organizations.`;
}
async function loadOverview() {
  state.orgs = await api("/organizations");
  state.orgs.sort((a, b) => a.name.localeCompare(b.name));
  // forget data for orgs that are no longer listed
  const ids = new Set(state.orgs.map(o => o.id));
  for (const k of ["inv", "invErr", "lic", "licErr", "stat", "detail"]) for (const id in state[k]) if (!ids.has(id)) delete state[k][id];
  render();
  await pool(state.orgs, 4, async o => {
    if (o.api && o.api.enabled === false) { state.invErr[o.id] = "API access disabled for this org"; return; }
    try { state.inv[o.id] = await api(`/organizations/${o.id}/inventory/devices`); delete state.invErr[o.id]; }
    catch (e) { if (e.notFound) { forgetOrg(o.id, o.name); render(); return; } state.invErr[o.id] = e.message; }
    render();
    try { state.lic[o.id] = await loadLicensing(o); delete state.licErr[o.id]; }
    catch (e) { state.licErr[o.id] = e.message; }
    render();
    // device statuses, for the Dormant count (a missing status list just leaves it blank)
    try { state.stat[o.id] = await api(`/organizations/${o.id}/devices/statuses`); } catch {}
    render();
  });
}

// Just the licensing data needed to work out which deployed devices are covered
async function loadLicensing(o) {
  const id = o.id, L = { model: o.licensing?.model || "unknown" };
  if (L.model === "co-term" || L.model === "per-device") L.overview = await api(`/organizations/${id}/licenses/overview`);
  if (L.model === "per-device") L.licenses = await api(`/organizations/${id}/licenses`);
  if (L.model === "subscription") L.subscriptions = await api(`/administered/licensing/subscription/subscriptions?organizationIds[]=${id}`);
  return L;
}

async function loadOrg(id) {
  const known = state.orgs.find(o => o.id === id);
  let org;
  try { org = await api(`/organizations/${id}`); }
  catch (e) {
    if (e.notFound) { forgetOrg(id, known?.name); location.hash = ""; return; }
    if (!known) throw e;
    org = known;
  }
  const model = org.licensing?.model || "unknown";
  const d = { org, model, err: {} };
  const tasks = {
    inventory: () => api(`/organizations/${id}/inventory/devices`),
    networks: () => api(`/organizations/${id}/networks`),
    statuses: () => api(`/organizations/${id}/devices/statuses`),
  };
  if (model === "co-term") {
    tasks.overview = () => api(`/organizations/${id}/licenses/overview`);
    tasks.coterm = () => api(`/organizations/${id}/licensing/coterm/licenses`);
  }
  if (model === "per-device") { tasks.overview = () => api(`/organizations/${id}/licenses/overview`); tasks.licenses = () => api(`/organizations/${id}/licenses`); }
  if (model === "subscription") {
    tasks.subscriptions = () => api(`/administered/licensing/subscription/subscriptions?organizationIds[]=${id}`);
    tasks.entitlements = () => api(`/administered/licensing/subscription/entitlements`);
  }
  let gone = false;
  await Promise.all(Object.entries(tasks).map(async ([k, f]) => {
    try { d[k] = await f(); } catch (e) { d.err[k] = e.message; if (e.notFound && k === "inventory") gone = true; }
  }));
  if (gone) { forgetOrg(id, org.name); location.hash = ""; return; }
  if (d.inventory) state.inv[id] = d.inventory;
  if (d.statuses) state.stat[id] = d.statuses;
  const licErr = d.err.overview || d.err.licenses || d.err.subscriptions;
  if (licErr) state.licErr[id] = licErr;
  else { state.lic[id] = { model, overview: d.overview, licenses: d.licenses, subscriptions: d.subscriptions }; delete state.licErr[id]; }
  state.detail[id] = d;
}

async function refresh() {
  if (state.loading || state.needKey) return;
  state.loading = true; state.error = null; setStatus(true);
  try {
    const id = route();
    if (!state.orgs.length || !id) await loadOverview();
    if (id) await loadOrg(id);
    state.updated = new Date();
  } catch (e) {
    if (e.auth) { state.needKey = true; state.keyError = "Meraki rejected that API key. Check it and try again."; }
    else state.error = e.message;
  } finally { state.loading = false; setStatus(false); render(); }
}

function setStatus(busy) {
  $("#refresh").disabled = busy;
  $("#status").innerHTML = busy ? `<span class="spinner"></span> Loading…`
    : state.updated ? `Updated ${state.updated.toLocaleTimeString()}` : "";
}

// ---------- derived ----------
function summarise(devs) {
  const total = devs.length, deployed = devs.filter(d => d.networkId).length;
  return { total, deployed, unassigned: total - deployed };
}
function familyOf(d) {
  const c = classifyModel(d.model);
  if (c.family !== "Other") return c.family;
  return { appliance: "MX", switch: "MS", wireless: "MR", camera: "MV", sensor: "MT", cellularGateway: "MG", wirelessController: "WLC" }[d.productType] || (d.productType || "Other");
}

// ---------- license coverage ----------
// Deployed devices are grouped by the license they need and compared with the licenses the org
// actually holds. Co-term and subscription licenses are pooled, so a shortfall can't be pinned
// to one device: every device in a short group is "over limit". Per-device licensing is exact.
// A co-term org that Meraki reports as compliant is trusted outright: model matching only runs
// when Meraki says the org is over its limits, and is then an estimate.
// "License Expires Soon" is still compliant: every device is covered until the co-term date
function cotermCompliant(ov) {
  return /^(ok|license expires soon)$/i.test(ov?.status || "") || /^(ok|license_expiration_near)$/.test(ov?.compliance?.status?.key || "");
}
// Tiered licenses carry an edition suffix in their row name: MS390-48E, MS130-CMPTA, C9300-24A
const TIERED_ROW = /^(MS1[35]0-(?:\d+|CMPT)|MS390-\d+|C9300-\d+|C9200L-\d+)([EA])$/;
function cotermPool(counts) {
  const pool = {};
  for (const [k, n] of Object.entries(counts || {})) {
    // one row can name several models, e.g. "MG41/MG41E"
    const keys = new Set(String(k).toUpperCase().split("/").map(part => {
      let key = part.trim();
      // MR Upgrade only converts an Enterprise license to Advanced, and Access Manager / Systems Manager aren't hardware
      if (/^MR[ -]UP(GR|GRADE)|^ACCSMGR|^ACCESS MANAGER|^SYSTEMS MANAGER|^SM$/.test(key)) return null;
      key = key.replace(/\s+(ENTERPRISE|ADVANCED.*)$/, "").replace(TIERED_ROW, "$1");
      if (key === "WIRELESS" || /^MR-(ADV|ENT)$/.test(key)) key = "MR"; // "MR-ADV" in the overview, "MR Advanced" in license counts
      if (/^(LIC-)?CW([ -](ADV|ESS|ENT|[AE]))?$/.test(key)) key = "CW";   // Wi-Fi 7 unified license rows
      return key.replace(/^(MG\d+)E$/, "$1"); // MG41E shares the MG41 license
    }).filter(Boolean));
    for (const key of keys) pool[key] = (pool[key] || 0) + n;
  }
  return pool;
}
// Org-wide Advanced tiers, read from license row names ("MR Advanced", "MS390-48 Advanced", "MS130-CMPTA")
function cotermAdvanced(names) {
  const out = { mr: false, ms: false, z4: false, cns: false, cw: false };
  for (const raw of names) {
    const k = String(raw).toUpperCase().trim();
    if (/^MR[ -]ADV/.test(k)) out.mr = true;
    if (/^(LIC-)?CW[ -]?(ADV|.*-A$)/.test(k)) out.cw = true;
    if (/^Z4C?\b.*(SEC|TELEWORKER)/.test(k)) out.z4 = true;
    if (/^(C9[356]\d0|LIC-CS-).*(ADV|-A$)/.test(k)) out.cns = true;
    if (/^(MS1[35]0|MS390|C9[23]00)\S*\s+ADVANCED/.test(k) || TIERED_ROW.exec(k)?.[2] === "A") out.ms = true;
  }
  return out;
}
function coverage(id) {
  const inv = state.inv[id], L = state.lic[id];
  if (!inv) return null;
  if (!L) return { err: state.licErr[id], pending: !state.licErr[id] };
  const inNet = inv.filter(x => x.networkId).map(x => ({ ...x, fam: familyOf(x) }));
  const groups = {}, status = {};
  // devices with config source: device (monitoring) and 9800 WLCs don't consume a license
  const mon = inNet.filter(x => !managementMode(x).consumes);
  for (const x of mon) status[x.serial] = "na";
  const dep = inNet.filter(x => status[x.serial] !== "na");
  const add = (key, x) => (groups[key] ||= { key, fam: x.fam, devs: [], have: 0 }).devs.push(x);
  let reason = "", exact = null, ea = null;
  if (L.model === "co-term") {
    const pool = cotermPool(L.overview?.licensedDeviceCounts);
    const expired = /expired/i.test(L.overview?.status || "");
    const compliant = !expired && cotermCompliant(L.overview);
    for (const x of dep) add(cotermLicense(x.model, x.fam).key, x);
    for (const g of Object.values(groups)) g.have = expired ? 0 : compliant ? g.devs.length : (pool[g.key] || 0);
    if (expired) reason = `The org's co-term license expired${L.overview.expirationDate ? " on " + L.overview.expirationDate : ""}, so no device is covered.`;
    else if (!compliant) reason = `Meraki reports this org as “${L.overview?.status || "not compliant"}”${L.overview?.compliance?.status?.description ? ": " + L.overview.compliance.status.description : ""} The license types below are matched by model, so treat them as an estimate and confirm in Meraki Dashboard (Organization → License info).`;
  } else if (L.model === "per-device") {
    exact = new Set((L.licenses || []).filter(l => l.deviceSerial && l.state === "active").map(l => l.deviceSerial));
    for (const x of dep) add(normaliseModel(x.model), x);
    for (const g of Object.values(groups)) g.have = g.devs.filter(x => exact.has(x.serial)).length;
  } else if (L.model === "subscription") {
    const pool = {};
    let assigned = 0, haveAssigned = false;
    for (const s of L.subscriptions || []) {
      if (s.status && !/active/i.test(s.status)) continue;
      for (const e of s.entitlements || []) {
        const k = String(e.sku || "").toUpperCase().replace(/-[AE]$/, "");
        pool[k] = (pool[k] || 0) + (e.seats?.limit ?? e.quantity ?? 0);
        if (e.seats?.assigned != null) { assigned += e.seats.assigned; haveAssigned = true; }
      }
    }
    for (const x of dep) add(classifyModel(x.model).sku, x);
    // EA / subscription utilization: seats in use out of seats held (Meraki's own count when the API gives it)
    const limit = Object.values(pool).reduce((a, n) => a + n, 0);
    ea = { limit, used: haveAssigned ? assigned
      : Object.entries(pool).reduce((a, [k, n]) => a + Math.min(n, groups[k]?.devs.length || 0), 0) };
    for (const g of Object.values(groups)) g.have = g.key === "—" ? g.devs.length : (pool[g.key] || 0); // no SKU listed: nothing to buy
  } else {
    return { err: `“${L.model}” licensing isn't supported` };
  }
  const list = Object.values(groups).sort((a, b) => famSort(a.fam, b.fam) || a.key.localeCompare(b.key));
  for (const g of list) {
    g.need = g.devs.length; g.short = Math.max(0, g.need - g.have);
    for (const x of g.devs) status[x.serial] = exact ? (exact.has(x.serial) ? "licensed" : "unlicensed")
      : !g.short ? "licensed" : g.have ? "over" : "unlicensed";
  }
  return { model: L.model, groups: list, mon, status, reason, ea, ...covCounts({ groups: list, mon }) };
}
// Counts for the whole org, or one product family
function covCounts(cov, fam) {
  let deployed = 0, unlicensed = 0;
  for (const g of cov.groups) {
    // one pool can span families (MR and CW share the MR license), so split its shortfall by device share
    const n = fam ? g.devs.filter(x => x.fam === fam).length : g.need;
    deployed += n; unlicensed += fam ? Math.round(g.short * n / g.need) : g.short;
  }
  const monitored = (cov.mon || []).filter(x => !fam || x.fam === fam).length;
  // `deployed` here is the devices that need a license; config source: device ones are counted apart
  return { deployed, unlicensed, licensed: deployed - unlicensed, monitored };
}
const COV_LABEL = { licensed: "Licensed", unlicensed: "Unlicensed", over: "Over limit", na: "N/A" };
const COV_TIP = {
  licensed: "Covered by an active license.",
  unlicensed: "In a network, but the org holds no active license for it.",
  over: "The org has fewer licenses than devices of this type. Licenses are pooled, so Meraki doesn't say which devices are the uncovered ones.",
  na: "Config source: device (monitoring): managed on-prem (or a 9800 controller), so it doesn't consume a Meraki license.",
};
// Tooltip explaining why a device with config source: device (monitoring) still needs a license
const whyTip = mgmt => `<strong>Why this needs a license with config source: device (monitoring)</strong><p>${esc(mgmt.why)}</p>`;
function covPill(st, mgmt) {
  if (!st) return '<span class="muted">—</span>';
  const why = mgmt?.mode === "monitored" && mgmt.consumes && mgmt.why;
  const tip = why ? whyTip(mgmt) + `<p class="muted">${esc(COV_TIP[st])}</p>` : esc(COV_TIP[st]);
  return `<span class="pill ${st === "licensed" ? "ok" : st === "na" ? "" : st === "over" ? "warn" : "bad"}" data-tip="${esc(tip)}" style="cursor:help">${COV_LABEL[st]}${why ? " ⓘ" : ""}</span>`;
}

// ---------- rendering ----------
function sortable(tableId, rows, cols, rowHtml, rowAttr) {
  const s = state.sort[tableId] || {};
  if (s.key) {
    const col = cols.find(c => c.key === s.key);
    rows = [...rows].sort((a, b) => {
      const x = col.val(a), y = col.val(b);
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * s.dir;
    });
  }
  const head = cols.map(c => `<th class="${c.num ? "num" : ""}" data-t="${tableId}" data-k="${c.key}">${c.label}${s.key === c.key ? (s.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${rows.map(r => `<tr ${rowAttr ? rowAttr(r) : ""}>${rowHtml(r)}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="muted">No rows</td></tr>`}</tbody></table></div>`;
}

function renderOverview() {
  const loaded = state.orgs.filter(o => state.inv[o.id]);
  const tot = summarise(loaded.flatMap(o => state.inv[o.id]));
  const rows = state.orgs.map(o => {
    const inv = state.inv[o.id];
    const s = inv ? summarise(inv) : null;
    const cov = coverage(o.id);
    const c = cov?.groups ? cov : null;
    // subscription / EA orgs show how much of the EA is utilized; co-term orgs their share of all deployed devices
    const eaPct = c?.ea?.limit ? pct(c.ea.used, c.ea.limit) : -1;
    return { o, s, cov, c, err: state.invErr[o.id], dep: s ? pct(s.deployed, s.total) : -1, licp: c ? pct(c.licensed, c.deployed) : -1,
      share: o.licensing?.model === "subscription" ? eaPct : s ? pct(s.deployed, tot.deployed) : -1 };
  });
  // Coverage totals only count orgs whose licensing loaded
  const covered = rows.filter(r => r.c);
  const lic = covered.reduce((n, r) => n + r.c.licensed, 0), unlic = covered.reduce((n, r) => n + r.c.unlicensed, 0);
  const covDep = lic + unlic, mon = covered.reduce((n, r) => n + r.c.monitored, 0);
  const unlicOrgs = covered.filter(r => r.c.unlicensed);
  const pending = rows.some(r => r.s && r.cov?.pending);
  const cols = [
    { key: "name", label: "Organization", val: r => r.o.name },
    { key: "id", label: "Org ID", val: r => r.o.id },
    { key: "model", label: "Licensing model", val: r => r.o.licensing?.model || "" },
    { key: "total", label: "Inventory", num: 1, val: r => r.s?.total ?? -1 },
    { key: "dep", label: "Deployed (in a network)", val: r => r.dep },
    { key: "licp", label: "Licensed (of those needing one)", val: r => r.licp },
    { key: "unlic", label: "Unlicensed", num: 1, val: r => r.c?.unlicensed ?? -1 },
    { key: "dorm", label: "Dormant", num: 1, val: r => dormant(r.o.id)?.length ?? -1 },
    { key: "share", label: shareLabel(state.orgs), val: r => r.share },
  ];
  const go = unlicOrgs.length === 1 ? `<a class="go" href="${unlicensedHref(unlicOrgs[0].o.id)}">See which networks →</a>`
    : unlicOrgs.length ? `<a class="go" href="#orgtable" data-jump="orgtable">Pick an organization ↓</a>` : "";

  const dorm = rows.reduce((n, r) => n + (dormant(r.o.id)?.length || 0), 0), statLoaded = state.orgs.some(o => state.stat[o.id]);
  return `
  <div class="tiles">
    <div class="tile"><div class="k">Inventory</div><div class="v">${tot.total}</div>
      <div class="s">Every device claimed across ${state.orgs.length} organization${state.orgs.length === 1 ? "" : "s"}</div></div>
    <div class="tile"><div class="k">Deployed <span class="pc">· ${fmtPct(pct(tot.deployed, tot.total))} of inventory</span></div><div class="v">${tot.deployed}</div>
      <div class="s">In a network${mon ? `<br>${mon} monitored with config source: device` : ""}${tot.unassigned ? `<br>${tot.unassigned} device${tot.unassigned === 1 ? "" : "s"} not assigned to a network` : ""}</div></div>
    <div class="tile"><div class="k">Licensed <span class="pc">· ${covDep ? fmtPct(pct(lic, covDep)) : "—"} of ${mon ? "those needing one" : "deployed"}</span></div><div class="v">${covered.length ? lic : "—"}</div>
      <div class="s">Deployed and covered by an active license${pending ? ' · <span class="spinner"></span> checking' : ""}</div></div>
    <div class="tile ${unlic ? "alert" : ""}"><div class="k">Unlicensed <span class="pc">· ${covDep ? fmtPct(pct(unlic, covDep)) : "—"} of ${mon ? "those needing one" : "deployed"}</span></div><div class="v">${covered.length ? unlic : "—"}</div>
      <div class="s">${unlic ? `Deployed with no license to cover them, in ${unlicOrgs.length} org${unlicOrgs.length === 1 ? "" : "s"}` : covered.length ? "Every deployed device is covered" : "Checking licenses…"}</div>${go}</div>
    <div class="tile ${dorm ? "warnt" : ""}"><div class="k">Dormant <span class="pc">· ${statLoaded ? fmtPct(pct(dorm, tot.deployed)) : "—"} of deployed</span></div><div class="v">${statLoaded ? dorm : "—"}</div>
      <div class="s">${DORMANT_SUB}</div></div>
  </div>
  ${renderSplit(tot.total, lic, unlic, mon, tot.deployed - covDep - mon, tot.unassigned)}
  <section class="card" id="orgtable">
    <h2>Organizations <span class="sub">A device only uses a license once it's in a network. Click an org for detail.</span></h2>
    ${sortable("orgs", rows, cols, r => `
      <td><strong>${esc(r.o.name)}</strong></td>
      <td class="mono">${esc(r.o.id)}</td>
      <td>${modelPill(r.o.licensing?.model)}</td>
      ${r.s ? `<td class="num">${r.s.total}</td>
        <td>${barN(r.s.deployed, r.dep, "")}</td>
        <td>${r.c ? barN(r.c.licensed, r.licp, "lic") : covNote(r.cov)}</td>
        <td class="num">${!r.c ? "" : r.c.unlicensed ? `<a class="go" style="padding:2px 8px" href="${unlicensedHref(r.o.id)}" title="See which networks">${r.c.unlicensed} →</a>` : '<span class="muted">0</span>'}</td>
        <td class="num">${(() => { const dm = dormant(r.o.id); return !dm ? "" : dm.length ? `<strong style="color:var(--warn)">${dm.length}</strong> <span class="muted">(${fmtPct(pct(dm.length, r.s.deployed))})</span>` : '<span class="muted">0</span>'; })()}</td>
        <td>${shareCell(r)}</td>`
        : `<td colspan="6" class="${r.err ? "err" : "muted"}">${r.err ? esc(r.err) : '<span class="spinner"></span> loading inventory…'}</td>`}`,
      r => `class="click" data-org="${esc(r.o.id)}"`)}
  </section>
  ${renderOrgCharts()}`;
}
// Column title: co-term orgs show their share of all deployed devices, subscription (EA) orgs their EA utilization
function shareLabel(orgs) {
  const sub = orgs.filter(o => o.licensing?.model === "subscription").length;
  return !sub ? "% of deployed devices across all orgs" : sub === orgs.length ? "% of EA utilized" : "% of deployed devices across all orgs / % of EA utilized";
}
function shareCell(r) {
  if (r.o.licensing?.model !== "subscription") return bar(r.share);
  const u = r.c?.ea;
  if (!u) return r.c ? "" : covNote(r.cov);
  if (!u.limit) return '<span class="muted">No EA seats</span>';
  return `${bar(r.share, "lic")}<div class="note" style="margin-top:1px">% of EA utilized · ${u.used} of ${u.limit} seats</div>`;
}
// Dormant: in a network, but Meraki hasn't heard from it in a while. It still uses a license.
const DORMANT_SUB = "In a network but not checking in, so still using a license";
function dormant(id) {
  const st = state.stat[id], inv = state.inv[id];
  if (!st || !inv) return null;
  const isDormant = new Set(st.filter(x => x.status === "dormant").map(x => x.serial));
  return inv.filter(x => x.networkId && isDormant.has(x.serial));
}
const barN = (n, v, cls) => `<div class="barwrap"><strong style="min-width:2.5em;text-align:right">${n}</strong><div class="bar ${cls}"><i style="width:${Math.min(100, v)}%"></i></div><span>${fmtPct(v)}</span></div>`;
const covNote = cov => !cov ? "" : cov.pending ? '<span class="spinner"></span>' : `<span class="err" title="${esc(cov.err)}">License data unavailable</span>`;

// One bar showing where the whole inventory stands
const SEG = { lic: "var(--seg-lic)", unlic: "var(--seg-unlic)", mon: "var(--seg-mon)", unknown: "var(--warn)", none: "var(--seg-none)" };
function renderSplit(total, lic, unlic, mon, unknown, none) {
  if (!total) return "";
  const t = (label, n, base, baseLabel) => `<strong>${label}</strong><br>${n} device${n === 1 ? "" : "s"} · ${fmtPct(pct(n, base))} of ${baseLabel}`;
  const segs = [
    { n: lic, color: SEG.lic, tip: t("Licensed", lic, total, "inventory") },
    { n: unlic, color: SEG.unlic, tip: t("Unlicensed", unlic, total, "inventory") },
    { n: mon, color: SEG.mon, tip: t("Config source: device (monitoring), no license needed", mon, total, "inventory") },
    { n: unknown, color: SEG.unknown, tip: t("Deployed, license not checked yet", unknown, total, "inventory") },
    { n: none, color: SEG.none, tip: t("Not in a network (no license needed)", none, total, "inventory") },
  ];
  const items = [["Licensed", SEG.lic, lic], ["Unlicensed", SEG.unlic, unlic], ...(mon ? [["Config source: device (monitoring)", SEG.mon, mon]] : []), ...(unknown ? [["Not checked", SEG.unknown, unknown]] : []), ["Not in a network", SEG.none, none]];
  const dep = lic + unlic + mon + unknown;
  return `<section class="card"><h2>Inventory breakdown <span class="sub">${total} devices</span></h2>
    <div class="split">${dep ? `<div class="depmark" style="width:${(100 * dep / total).toFixed(2)}%">Deployed <strong>${dep}</strong> · ${fmtPct(pct(dep, total))} of inventory</div>` : ""}${hbar(segs, total)}
      <span class="legend">${items.map(([l, c, n]) => `<span><i style="background:${c}"></i>${l} <strong style="color:var(--text)">${n}</strong> (${fmtPct(pct(n, total))})</span>`).join("")}</span></div></section>`;
}

// ---------- charts ----------
const FAMILY_ORDER = ["MX", "MS", "MR", "CW", "MV", "MT", "MG", "WLC"];
// Colour follows the family, never its rank: each family owns one fixed slot.
const famColor = f => { const i = FAMILY_ORDER.indexOf(f); return i < 0 ? "var(--s-other)" : `var(--s${i + 1})`; };
const famSort = (a, b) => {
  const ia = FAMILY_ORDER.indexOf(a), ib = FAMILY_ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
};
const legend = items => `<span class="legend">${items.map(([label, color]) => `<span><i style="background:${color}"></i>${esc(label)}</span>`).join("")}</span>`;
// One horizontal stacked bar, scaled against `max`. segs: [{ n, color, tip }]
function hbar(segs, max) {
  const total = segs.reduce((a, x) => a + x.n, 0);
  if (!total) return `<div class="track"></div>`;
  return `<div class="track"><div class="hbar" style="width:${(100 * total / max).toFixed(2)}%">${segs.filter(x => x.n)
    .map(x => `<span style="flex:${x.n};background:${x.color}" data-tip="${esc(x.tip)}"></span>`).join("")}</div></div>`;
}

function renderOrgCharts() {
  const cards = state.orgs.filter(o => state.inv[o.id]?.length).map(o => {
    const cov = coverage(o.id), c = cov?.groups ? cov : null;
    const by = {};
    for (const d of state.inv[o.id]) {
      const f = familyOf(d), r = by[f] ||= { lic: 0, unlic: 0, mon: 0, unknown: 0, none: 0 };
      r[!d.networkId ? "none" : !c ? "unknown" : c.status[d.serial] === "na" ? "mon" : "lic"]++;
    }
    if (c) for (const f in by) by[f].unlic = covCounts(c, f).unlicensed, by[f].lic -= by[f].unlic;
    const fams = Object.keys(by).sort(famSort);
    const sum = r => r.lic + r.unlic + r.mon + r.unknown + r.none;
    const max = Math.max(...fams.map(f => sum(by[f])));
    const rows = fams.map(f => {
      const r = by[f], t = sum(r), dep = t - r.none, tip = (label, n) => `<strong>${esc(f)}</strong><br>${label}: ${n} of ${t} (${fmtPct(pct(n, t))})<br>Deployed: ${dep} of ${t}`;
      return `<div class="hrow"><span class="lbl"><strong>${esc(f)}</strong></span>
        ${hbar([{ n: r.lic, color: SEG.lic, tip: tip("Licensed", r.lic) }, { n: r.unlic, color: SEG.unlic, tip: tip("Unlicensed", r.unlic) },
                { n: r.mon, color: SEG.mon, tip: tip("Config source: device (monitoring), no license needed", r.mon) }, { n: r.unknown, color: SEG.unknown, tip: tip("Deployed, license not checked", r.unknown) }, { n: r.none, color: SEG.none, tip: tip("Not in a network", r.none) }], max)}
        <span class="val" title="Deployed / total"><strong style="color:var(--text)">${dep}</strong> / ${t}</span></div>`;
    }).join("");
    const s = summarise(state.inv[o.id]);
    return `<div class="orgchart" data-org="${esc(o.id)}"><h3>${esc(o.name)}</h3>
      <div class="s"><strong style="color:var(--text)">${s.deployed} deployed</strong>${c ? ` (${c.licensed} licensed · <span class="${c.unlicensed ? "err" : ""}">${c.unlicensed} unlicensed</span>${c.monitored ? ` · ${c.monitored} config source: device` : ""})` : ""} · ${s.unassigned} not in a network</div>${rows}</div>`;
  }).join("");
  if (!cards) return "";
  return `<section class="card"><h2>By product family
    ${legend([["Licensed", SEG.lic], ["Unlicensed", SEG.unlic], ["Config source: device (monitoring)", SEG.mon], ["Not in a network", SEG.none]])}</h2>
    <div class="orgcharts">${cards}</div>
    <div class="body note" style="padding-top:0">Numbers on the right are deployed / total devices. Hover a bar for detail; click an organization to open it.</div></section>`;
}

function renderNetworkChart(id, all) {
  const d = state.detail[id];
  const fam = state.ffam || "";
  const devs = fam ? all.filter(x => x.fam === fam) : all;
  const rows = (d.networks || []).map(n => ({ id: n.id, name: n.name, devs: devs.filter(x => x.networkId === n.id) }));
  // networks we don't have names for (e.g. no access) still count
  for (const x of devs) if (x.networkId && !rows.some(r => r.id === x.networkId)) rows.push({ id: x.networkId, name: x.networkId, devs: devs.filter(y => y.networkId === x.networkId) });
  rows.sort((a, b) => b.devs.length - a.devs.length || a.name.localeCompare(b.name));
  const unassigned = devs.filter(x => !x.networkId);
  if (unassigned.length) rows.push({ id: "__none__", name: "Not in a network", devs: unassigned, none: true });
  if (!rows.length) return "";

  const fams = [...new Set(devs.map(x => x.fam))].sort(famSort);
  const max = Math.max(1, ...rows.map(r => r.devs.length));
  const LIMIT = 15;
  const shown = state.showAllNets || rows.length <= LIMIT + 1 ? rows : [...rows.slice(0, LIMIT), ...rows.filter(r => r.none)];
  const html = shown.map(r => {
    const by = {};
    for (const x of r.devs) by[x.fam] = (by[x.fam] || 0) + 1;
    const segs = Object.keys(by).sort(famSort).map(f => ({ n: by[f], color: famColor(f),
      tip: `<strong>${esc(r.name)}</strong><br>${esc(f)}: ${by[f]} device${by[f] > 1 ? "s" : ""}${r.none ? " (not licensed)" : ""}` }));
    return `<div class="hrow net ${state.fnet === r.id ? "on" : ""}" data-net="${esc(r.id)}" title="Show only this network's devices">
      <span class="lbl ${r.none ? "muted" : ""}">${r.none ? "<em>Not in a network</em>" : esc(r.name)}</span>
      ${hbar(segs, max)}<span class="val">${r.devs.length || '<span class="muted">0</span>'}</span></div>`;
  }).join("");
  const nNets = rows.filter(r => !r.none).length;
  const more = shown.length < rows.length || state.showAllNets && rows.length > LIMIT + 1
    ? `<button id="allnets" style="margin:6px 6px 0">${state.showAllNets ? "Show top 15" : `Show all ${nNets} networks`}</button>` : "";
  return `<section class="card viz"><h2>Devices by network <span class="sub">${nNets} network${nNets === 1 ? "" : "s"}${fam ? ` · ${esc(fam)} only` : ""} · devices in a network need a license</span>
    ${legend(fams.map(f => [f, famColor(f)]))}</h2>
    <div class="chartbody">${html}${more}</div></section>`;
}

function modelPill(m) {
  if (!m) return `<span class="muted">—</span>`;
  return `<span class="pill ${m === "subscription" ? "info" : m === "co-term" ? "ok" : "warn"}">${esc(m)}</span>`;
}

// ---------- license edition and SKU ----------
// Co-term: editions are org-wide per product line (MX: Enterprise / Advanced Security / Secure SD-WAN
// Plus; MR: Enterprise / Advanced; MS130, MS150, MS390, Catalyst: Enterprise / Advanced) and SKUs are
// per model (licensing-map.js cotermLicense). Subscription: Essentials / Advantage per entitlement SKU.
function tierContext(d) {
  const ctx = { appliance: null, mrAdv: false, msAdv: false, expired: false, subTiers: {}, perDevice: {} };
  const names = Object.keys(d.overview?.licensedDeviceCounts || {});
  if (Array.isArray(d.coterm)) {
    let lic = d.coterm.filter(l => !l.invalidated && !l.expired);

    const catalog = Object.fromEntries((d.entitlements || []).map(e => [String(e.sku).toUpperCase(), e.featureTier]));
    for (const s of d.subscriptions || []) {
      if (s.status && !/active/i.test(s.status)) continue;
      for (const e of s.entitlements || []) {
        const sku = String(e.sku || "").toUpperCase();
        const t = catalog[sku] || (/-A$/.test(sku) ? "advantage" : /-E$/.test(sku) ? "essentials" : null);

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  if (/security|^sec/i.test(v)) return { name: "Advanced Security", code: "SEC" };
  if (/advan|^adv/i.test(v)) return { name: "Advanced", code: "ADV" };

}

function baseLicense(d, ctx, x) {

    const t = ctx.subTiers[lic.sku];
    if (!t) return { tier: "No entitlement", sku: lic.sku, note: "Org holds no active entitlement for this SKU" };
    if (t.size > 1) return { tier: "Essentials or Advantage", sku: `${lic.sku}-E / -A`, note: "Org holds both; tier is set per network" };
    const tier = [...t][0];
    return { tier: cap(tier), sku: `${lic.sku}-${tier === "advantage" ? "A" : "E"}` };
  }
  // co-term and per-device both use per-model licenses
  const co = cotermLicense(x.model, x.fam);

  let ed = { name: "Enterprise", code: "ENT" };
  const notes = [];
  if (d.model === "per-device") {
    const t = ctx.perDevice[x.serial];

    ed = edition(t);

  $("#clearfilters").hidden = !f.length;
  el.innerHTML = sortable("devs", rows, DEV_COLS, r => `
    <td class="mono">${esc(r.serial)}</td><td class="mono">${esc(r.model)}</td><td>${esc(r.name)}</td>
    <td>${r.net ? esc(r.net) : '<span class="muted">—</span>'}</td>
    <td>${r.networkId ? '<span class="pill ok">yes</span>' : '<span class="pill warn">no</span>'}</td>
    <td>${r.st ? statusPill(r.st) : '<span class="muted">—</span>'}</td>
    <td><span class="pill ${r.mgmt.mode === "monitored" ? "" : "info"}" ${r.mgmt.note ? `data-tip="${esc(r.mgmt.why ? whyTip(r.mgmt) : esc(r.mgmt.note))}" style="cursor:help"` : ""}>${r.mgmt.label}${r.mgmt.why ? " ⓘ" : ""}</span></td>
    <td>${r.networkId ? covPill(r.cov, r.mgmt) : '<span class="muted">—</span>'}</td>
    <td>${r.cov === "na" ? '<span class="muted">not needed</span>' : r.networkId ? `<span ${r.license.note ? `data-tip="${esc(esc(r.license.note))}" style="cursor:help"` : ""}>${tierPill(r.license.tier)}</span>` : '<span class="muted">not licensed</span>'}</td>
    <td class="mono ${r.networkId ? "" : "muted"}" title="${esc(r.license.note || r.lic.note || "")}">${esc(r.license.sku)}${(r.license.inferred ?? r.lic.inferred) ? ' <span class="pill warn">inferred</span>' : ""}${r.lic.catalyst ? ` <a class="pill info" style="text-decoration:none" href="${MS_DOC}" target="_blank" rel="noopener" data-tip="${esc(dnaTip(r.license.sku))}">DNA*</a>` : ""}</td>`);
}

function dnaTip(sku) {
  const uses = /^LIC-/.test(sku) ? `it consumes a ${sku} license like any MS switch` : "the MS doc lists no Meraki SKU for this model";
  return `<strong>DNA* = Cisco DNA license</strong>` +
    `<p>This Catalyst switch was bought with a Cisco DNA software license.</p>` +
    `<p><strong>No Meraki license needed</strong> when it's in:</p>` +
    `<ul><li>Cloud monitoring (monitor-only in Meraki Dashboard)</li><li>Cloud management with configuration source: device (config stays on the switch)</li></ul>` +
    `<p><strong>License needed</strong> when it's fully managed by Meraki (config from Meraki Dashboard): ${uses}.</p>` +
    `<p class="muted">Source: footnote (*) on <a href="${MS_DOC}" target="_blank" rel="noopener">Meraki's Subscription – MS Licensing page ↗</a>. The API doesn't report which mode a switch is in, so check it in Meraki Dashboard.</p>`;
}
const MS_DOC = "https://documentation.meraki.com/Platform_Management/Product_Information/Meraki_Licensing/Subscription_Licensing/Subscription_-_MS_Licensing";

function exportCsv(id) {
  const d = state.detail[id];
  const rows = sortedDevs(id);
  const head = ["orgId", "orgName", "serial", "model", "name", "family", "network", "deployed", "online", "configSource", "licensed", "licenseClass", "licenseSku", "skuInferred"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.join(",")].concat(rows.map(r => [d.org.id, d.org.name, r.serial, r.model, r.name, r.fam, r.net, r.networkId ? "yes" : "no", r.st, r.mgmt.label, COV_LABEL[r.cov] || "", r.cov === "na" ? "not needed" : r.networkId ? r.license.tier : "not licensed", r.license.sku, r.license.inferred ?? r.lic.inferred].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  const tag = activeFilters(id).map(([, v]) => v).join("-").replace(/[^A-Za-z0-9._-]+/g, "_").slice(0, 80);
  const day = new Date().toISOString().slice(0, 10);
  a.download = `meraki-inventory-${d.org.name.replace(/[^A-Za-z0-9._-]+/g, "_")}${tag ? "-" + tag : ""}-${day}.csv`; a.click();
}

function renderKeyScreen() {
  const has = !!getKey();
  return `<section class="card" style="max-width:520px;margin:40px auto"><h2>Connect to Meraki</h2><div class="body">
    <p style="margin-top:0">Enter your Meraki Dashboard API key to see the organizations it has access to.</p>
    <div class="readonly"><strong>Read-only:</strong> This tool only sends GET (read) requests to the Meraki Dashboard API. It never sends POST, PUT or DELETE requests, so it can't make any changes to your Meraki Dashboard.</div>
    <form id="keyform">
      <input id="keyinput" type="password" autocomplete="off" placeholder="Meraki API key" style="width:100%" required>
      <label class="note" style="display:block;margin:10px 0"><input type="checkbox" id="keyremember" checked> Remember on this computer</label>
      ${state.keyError ? `<div class="err" style="margin-bottom:10px">${esc(state.keyError)}</div>` : ""}
      <button class="primary" type="submit">Connect</button>
      ${has ? '<button type="button" id="keycancel">Cancel</button> <button type="button" id="keyforget">Forget saved key</button>' : ""}
    </form>
    <p class="note">Your key stays on this computer. It's stored in this browser and sent only to this app running locally, which passes it to api.meraki.com. 
    A read-only Meraki Dashboard admin is enough. <a href="https://developer.cisco.com/meraki/api-v1/authorization/" target="_blank" rel="noopener">How to create an API key ↗</a></p>
  </div></section>`;
}

const noticeHtml = () => state.notice ? `<div class="notice">${esc(state.notice)} <button id="dismissnotice" title="Dismiss">✕</button></div>` : "";
function render() {
  const id = route();
  const focus = document.activeElement?.id, caret = document.activeElement?.selectionStart;
  $("#app").innerHTML = state.needKey ? renderKeyScreen()
    : state.error && !state.orgs.length ? `<section class="card"><div class="body err">Failed to load: ${esc(state.error)}</div></section>`
    : id ? (view() === "unlicensed" ? renderUnlicensed(id) : renderOrg(id)) : noticeHtml() + renderOverview();
  if (id && state.detail[id]?.inventory) renderDevTable(id);
  if (state.jumpDevices && $("#devices")) { state.jumpDevices = false; $("#devices").scrollIntoView({ block: "start" }); }
  if (focus && $("#" + focus)) { $("#" + focus).focus(); if (caret != null) try { $("#" + focus).setSelectionRange(caret, caret); } catch {} }
  setStatus(state.loading);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const th = e.target.closest("th[data-t]");
  if (th) {
    const t = th.dataset.t, k = th.dataset.k, cur = state.sort[t];
    state.sort[t] = { key: k, dir: cur?.key === k ? -cur.dir : 1 };
    t === "devs" ? renderDevTable(route()) : render();
    return;
  }
  // links and buttons inside a clickable org row go where they say, not to the org
  const un = e.target.closest("[data-unlicnet]");
  if (un) {
    e.preventDefault();
    state.pending = { fnet: un.dataset.unlicnet, fdep: "unlicensed" };
    location.hash = "org=" + encodeURIComponent(route());
    return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump) { e.preventDefault(); $("#" + jump.dataset.jump)?.scrollIntoView({ behavior: "smooth" }); return; }
  if (e.target.closest("a[href^='#org=']")) return;
  const tile = e.target.closest("[data-tile]");
  if (tile) {
    Object.assign(state, TILE_FILTER[tile.dataset.tile]);
    render();
    $("#devices")?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const tr = e.target.closest("[data-org]");
  if (tr) { location.hash = "org=" + encodeURIComponent(tr.dataset.org); return; }
  const net = e.target.closest("[data-net]");
  if (net) {
    state.fnet = state.fnet === net.dataset.net ? "" : net.dataset.net;
    render();
    if (state.fnet) $("#devices")?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (e.target.id === "dismissnotice") { state.notice = ""; render(); return; }
  if (e.target.id === "clearfilters") { Object.assign(state, { ffam: "", fnet: "", fmodel: "", fdep: "all", fsrc: "", q: "" }); render(); return; }
  if (e.target.id === "allnets") { state.showAllNets = !state.showAllNets; render(); return; }
  if (e.target.closest("[data-home]")) { location.hash = ""; return; }
  const chip = e.target.closest("[data-fam]");
  if (chip) {
    state.ffam = chip.dataset.fam;
    // drop a model filter that doesn't belong to the newly chosen family
    if (state.fmodel && state.ffam && !orgDevices(route()).some(x => x.model === state.fmodel && x.fam === state.ffam)) state.fmodel = "";
    render(); return;
  }
  if (e.target.id === "csv") exportCsv(route());
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; renderDevTable(route()); }
});
document.addEventListener("change", e => {
  if (e.target.id === "fdep") { state.fdep = e.target.value; render(); }       // re-render so the matching tile highlights
  if (e.target.id === "fnet") { state.fnet = e.target.value; render(); }      // re-render so the network chart highlights it
  if (e.target.id === "fmodel") { state.fmodel = e.target.value; renderDevTable(route()); }
  if (e.target.id === "fsrc") { state.fsrc = e.target.value; render(); }
  if (e.target.id === "auto") schedule();
});
window.addEventListener("hashchange", () => {
  state.q = ""; state.fdep = "all"; state.fsrc = ""; state.ffam = ""; state.fnet = ""; state.fmodel = ""; state.showAllNets = false;
  if (state.pending) { Object.assign(state, state.pending); state.pending = null; state.jumpDevices = true; }
  scrollTo(0, 0);
  render();
  const id = route();
  if (id) refresh();
});
$("#refresh").onclick = refresh;
// Theme: Auto follows the computer's light/dark setting; Light/Dark override it and are remembered.
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  $("#theme").value = t || "auto";
}
try { applyTheme(localStorage.getItem("theme") || "auto"); } catch { applyTheme("auto"); }
$("#theme").onchange = e => {
  applyTheme(e.target.value);
  try { localStorage.setItem("theme", e.target.value); } catch {}
};
$("#keybtn").onclick =() => { state.needKey = true; state.keyError = ""; render(); };
document.addEventListener("submit", e => {
  if (e.target.id !== "keyform") return;
  e.preventDefault();
  setKey($("#keyinput").value.trim(), $("#keyremember").checked);
  Object.assign(state, { needKey: false, keyError: "", error: null, orgs: [], inv: {}, invErr: {}, detail: {} });
  location.hash = "";
  refresh();
});
document.addEventListener("click", e => {
  if (e.target.id === "keycancel") { state.needKey = false; render(); }
  if (e.target.id === "keyforget") { setKey(""); state.keyError = ""; Object.assign(state, { orgs: [], inv: {}, invErr: {}, detail: {} }); render(); }
});

// Hover tooltips for [data-tip] (fixed-position so table scroll containers don't clip them)
// Stays open while the pointer is on the tooltip, so links inside it can be clicked.
const tip = document.body.appendChild(Object.assign(document.createElement("div"), { id: "tip" }));
let hideTip;
document.addEventListener("mouseover", e => {
  clearTimeout(hideTip);
  if (e.target.closest("#tip")) return;
  const t = e.target.closest("[data-tip]");
  if (!t) { hideTip = setTimeout(() => { tip.style.display = "none"; }, 300); return; }
  tip.innerHTML = t.dataset.tip;
  tip.style.display = "block";
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  tip.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 6 : r.bottom + 6) + "px";
});
addEventListener("scroll", () => { tip.style.display = "none"; }, true);

let timer;
function schedule() {
  clearInterval(timer);
  const s = +$("#auto").value;
  if (s) timer = setInterval(refresh, s * 1000);
}
schedule();
(async () => {
  let cfg = {};
  try { cfg = await (await fetch("/config")).json(); } catch {}
  if (!cfg.hasDefaultKey && !getKey()) { state.needKey = true; render(); }
  else refresh();
})();
</script>
</body>
</html>
